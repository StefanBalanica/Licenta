<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <!-- White background fill for favicon contexts -->
  <circle cx="250" cy="250" r="248" fill="white"/>

  <!-- Outer thick ring -->
  <circle cx="250" cy="250" r="238" fill="none" stroke="#0d0d0d" stroke-width="18"/>

  <!-- Inner ring -->
  <circle cx="250" cy="250" r="188" fill="none" stroke="#0d0d0d" stroke-width="7"/>

  <!-- Curved text paths -->
  <defs>
    <path id="arc-top"    d="M 42,250 A 208,208 0 0,1 458,250"/>
    <path id="arc-bottom" d="M 70,318 A 198,198 0 0,0 430,318"/>
  </defs>

  <!-- "THE INVESTIGATION" on top arc -->
  <text font-family="'Georgia', 'Times New Roman', serif" font-weight="700" font-size="37" fill="#0d0d0d" letter-spacing="4">
    <textPath href="#arc-top" startOffset="50%" text-anchor="middle">THE INVESTIGATION</textPath>
  </text>

  <!-- "FOLLOW THE EVIDENCE" on bottom arc -->
  <text font-family="'Georgia', 'Times New Roman', serif" font-weight="700" font-size="28" fill="#0d0d0d" letter-spacing="3">
    <textPath href="#arc-bottom" startOffset="50%" text-anchor="middle">FOLLOW THE EVIDENCE</textPath>
  </text>

  <!-- ── DETECTIVE SILHOUETTE (side profile, facing right) ── -->

  <!-- Hat brim -->
  <ellipse cx="232" cy="165" rx="72" ry="11" fill="#0d0d0d"/>

  <!-- Hat crown -->
  <path d="M 196,165 Q 194,118 213,104 Q 234,90 260,97 Q 282,105 284,140 L 284,165 Z" fill="#0d0d0d"/>

  <!-- Hat band (thin light stripe) -->
  <rect x="197" y="153" width="87" height="8" fill="#333"/>

  <!-- Head / face profile -->
  <path d="
    M 220,164
    Q 268,162 285,178
    Q 302,196 295,220
    Q 290,240 278,250
    Q 265,260 252,260
    Q 235,260 224,248
    Q 208,232 210,208
    Q 210,183 220,164
    Z
  " fill="#0d0d0d"/>

  <!-- Subtle nose/jaw highlight -->
  <path d="M 294,200 Q 302,218 296,234" fill="none" stroke="#0d0d0d" stroke-width="0"/>

  <!-- Neck -->
  <rect x="231" y="258" width="27" height="22" fill="#0d0d0d"/>

  <!-- Shirt + collar -->
  <path d="M 244,265 L 250,330 L 256,265 Z" fill="white"/>

  <!-- Jacket / suit body -->
  <path d="
    M 185,390
    L 212,275
    Q 222,258 250,256
    Q 278,258 288,275
    L 318,390
    Z
  " fill="#0d0d0d"/>

  <!-- Left lapel -->
  <path d="M 245,268 L 225,308 L 250,285 Z" fill="white"/>
  <!-- Right lapel -->
  <path d="M 255,268 L 278,308 L 250,285 Z" fill="white"/>

  <!-- Tie -->
  <path d="M 247,278 Q 250,285 253,278 L 252,340 L 250,345 L 248,340 Z" fill="#1a1a1a"/>

  <!-- ── MAGNIFYING GLASS ── -->
  <!-- Lens -->
  <circle cx="305" cy="225" r="32" fill="none" stroke="#0d0d0d" stroke-width="13"/>
  <!-- Handle -->
  <line x1="328" y1="248" x2="348" y2="268" stroke="#0d0d0d" stroke-width="13" stroke-linecap="round"/>
</svg>
